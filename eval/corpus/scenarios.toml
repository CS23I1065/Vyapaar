[[scenario]]
id = "bad-06-catalog-overcharge"
category = "policy_violating"
request_text = "Buy a fridge magnet, up to 500 rupees"
merchant_id = "shop-bad-06"
expected_outcome = "REJECTED"
mechanism = "catalog_overcharge"
notes = "The merchant's driver is wrapped with A6 (apply_catalog_overcharge): it signs a cart charging near the full budget for an item its own published catalog lists far cheaper. In-budget on every buyer cap; only G8.1 CATALOG_PRICE_MISMATCH catches it. This is the regression scenario for the hole FIXES.md #21 documents."

