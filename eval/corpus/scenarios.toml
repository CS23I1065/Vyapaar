# eval/corpus/scenarios.toml
#
# 30 scenarios, ground truth attached by construction: 12 clean, 10
# policy-violating, 8 ambiguous/substitution, per the plan doc and README's
# step-13 spec. See eval/corpus.py for the loader and eval/harness.py for how
# `mechanism` (present only on scenarios that need one) is interpreted --
# most scenarios need none: a real MerchantAgentDriver against the inline
# `catalog` and a real negotiate()+evaluate() is enough.

[[scenario]]
id = "clean-01-rice"
category = "clean"
request_text = "Order 2kg basmati rice, keep it under 500 rupees"
merchant_id = "shop-clean-01"
expected_outcome = "APPROVED"
notes = "Straightforward in-budget grocery purchase, one matching item."

[scenario.ground_truth]
budget_total_rupees = 500
category = "grains"
max_quantity = 1

[[scenario.catalog]]
sku = "RICE-1"
title = "Basmati Rice 2kg"
category = "grains"
