[[scenario]]
id = "bad-03-excluded-category"
category = "policy_violating"
request_text = "Buy a bottle of wine, budget 2000 rupees, but nothing alcoholic please"
merchant_id = "shop-bad-03"
expected_outcome = "REJECTED"
notes = "A contradictory request by construction -- the only match is in the shopper's own excluded category. The merchant driver's own matching filters out excluded categories before proposing a cart at all (real behaviour, not a fixture gap), so this resolves via a decline rather than G3.2 firing directly; either path correctly yields REJECTED and neither implies the item was ever offered."

[scenario.ground_truth]
budget_total_rupees = 2000
category = "alcohol"
excluded_categories = ["alcohol"]

[[scenario.catalog]]
sku = "WINE-1"
title = "Red Wine 750ml"
category = "alcohol"
price_paise = 120000


[[scenario]]
id = "bad-04-required-attribute-mismatch"
category = "policy_violating"
request_text = "Buy an organic cotton shirt, up to 2000 rupees"
merchant_id = "shop-bad-04"
expected_outcome = "REJECTED"
notes = "No catalog item satisfies the required attribute -- the merchant driver's own matching filters on required_attributes before proposing a cart, so this resolves via a decline rather than G3.1 firing directly. G3.1 is exercised separately by buyer/policy_engine.py's own exhaustive test suite, which constructs a cart that DOES reach evaluate() with a mismatched attribute."

[scenario.ground_truth]
budget_total_rupees = 2000
category = "apparel"
required_attributes = [{ key = "material", value = "organic-cotton" }]

[[scenario.catalog]]
sku = "SHIRT-SYN"
title = "Polyester Shirt"
category = "apparel"
price_paise = 90000
attributes = { material = "polyester" }


